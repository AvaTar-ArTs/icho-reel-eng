name: ci

on:
  push:
    branches: [main, "foundation/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package
        run: pip install -e '.[dev]'
      - name: Lint
        run: ruff check src tests
      - name: Test
        run: pytest -q
      - name: Validate examples
        run: |
          icho-reel validate content/examples/builder-commentary.json
          icho-reel validate content/examples/gameplay-insight.json
          icho-reel validate content/examples/anthology-lore.json
