[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "icho-reel-eng"
version = "0.3.0"
description = "Personal short-form media automation engine for ichoTaKu"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.22,<5",
  "pydantic>=2.7,<3",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.6,<1",
]

[project.scripts]
icho-reel = "icho_reel_eng.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
